<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cartoon Now</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">CARTOON NOW</div>

        <nav>
            <a href="#">Início</a>
            <a href="#filmes">Filmes</a>
            <a href="#series">Séries</a>
        </nav>
    </header>


    <main>

        <!-- BANNER PRINCIPAL -->
        <section class="banner">

            <div class="banner-content">
                <h1>Cartoon Now</h1>

                <p>
                    Assista seus filmes e séries favoritos.
                </p>

                <button onclick="assistirDestaque()">
                    ▶ Assistir
                </button>
            </div>

        </section>


        <!-- FILMES -->
        <section id="filmes" class="section">

            <h2>Filmes</h2>

            <div class="cards">

                <div class="card" onclick="assistir('pica_pau.mp4')">
                    <img src="assets/posters/filme_1.jpg" alt="Pica Pau">
                    <h3>Pica Pau</h3>
                </div>

                <div class="card" onclick="assistir('filme_2.mp4')">
                    <img src="assets/posters/filme_2.jpg" alt="Filme 2">
                    <h3>Filme 2</h3>
                </div>

                <div class="card" onclick="assistir('filme_3.mp4')">
                    <img src="assets/posters/filme_3.jpg" alt="Filme 3">
                    <h3>Filme 3</h3>
                </div>

            </div>

        </section>


        <!-- SÉRIES -->
        <section id="series" class="section">

            <h2>Séries</h2>

            <div class="cards">

                <div class="card" onclick="assistir('serie_1_ep_01.mp4')">
                    <img src="assets/posters/serie_1.jpg" alt="Série 1">
                    <h3>Série 1</h3>
                </div>

                <div class="card" onclick="assistir('serie_2_ep_01.mp4')">
                    <img src="assets/posters/serie_2.jpg" alt="Série 2">
                    <h3>Série 2</h3>
                </div>

            </div>

        </section>

    </main>


    <!-- PLAYER -->
    <div id="player" class="player">

        <button class="fechar" onclick="fecharPlayer()">✕</button>

        <video id="videoPlayer" controls>
            Seu navegador não suporta vídeo.
        </video>

    </div>


    <footer>
        <p>© 2026 Cartoon Now</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
